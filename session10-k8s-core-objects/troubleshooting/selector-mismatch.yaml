apiVersion: apps/v1
kind: Deployment
metadata:
  name: selector-error-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: backend      # <-- MISMATCH: does not match spec.selector.matchLabels
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
