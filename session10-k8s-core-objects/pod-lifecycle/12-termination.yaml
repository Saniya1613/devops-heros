apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-termination
spec:
  terminationGracePeriodSeconds: 30
  containers:
    - name: graceful
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          trap 'echo "SIGTERM received - draining connections"; sleep 10; echo "cleanup done"; exit 0' TERM
          echo "app started, serving traffic"
          while true; do sleep 1; done
