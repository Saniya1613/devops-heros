apiVersion: v1
kind: Pod
metadata:
  name: lifecycle-startup
spec:
  containers:
    - name: slow-app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 20; touch /tmp/started; sleep 3600"]
      startupProbe:
        exec:
          command: ["cat", "/tmp/started"]
        failureThreshold: 30
        periodSeconds: 5
      livenessProbe:
        exec:
          command: ["cat", "/tmp/started"]
        periodSeconds: 5
