apiVersion: v1
kind: ConfigMap
metadata:
  name: app-rolling-html-v1
data:
  index.html: |
    <html><body><h1>APP ROLLING</h1><p>VERSION: v1</p></body></html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-rolling
  labels:
    app: app-rolling
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: app-rolling
  template:
    metadata:
      labels:
        app: app-rolling
        version: v1
    spec:
      containers:
        - name: web
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: app-rolling-html-v1
