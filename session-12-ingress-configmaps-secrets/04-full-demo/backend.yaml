apiVersion: apps/v1
kind: Deployment
metadata:
  name: yatri-backend
  labels:
    app: yatri-app
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: yatri-backend
  template:
    metadata:
      labels:
        app: yatri-backend
        tier: backend
    spec:
      containers:
        - name: backend
          image: python:3.12-alpine
          command:
            - sh
            - -c
            - |
              cat > /app.py <<'PY'
              import os
              from http.server import BaseHTTPRequestHandler, HTTPServer
              class H(BaseHTTPRequestHandler):
                  def do_GET(self):
                      body = (
                          "YATRI BACKEND API\n"
                          f"ENVIRONMENT: {os.environ.get('ENVIRONMENT')}\n"
                          f"LOG_LEVEL: {os.environ.get('LOG_LEVEL')}\n"
                          f"DEFAULT_CURRENCY: {os.environ.get('DEFAULT_CURRENCY')}\n"
                          f"POSTGRES_USER: {os.environ.get('POSTGRES_USER')}\n"
                          f"POSTGRES_PASSWORD: {os.environ.get('POSTGRES_PASSWORD')}\n"
                          f"PATH_REQUESTED: {self.path}\n"
                      )
                      self.send_response(200)
                      self.send_header("Content-Type", "text/plain")
                      self.end_headers()
                      self.wfile.write(body.encode())
                  def log_message(self, *a): pass
              HTTPServer(("", 8080), H).serve_forever()
              PY
              python /app.py
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: yatri-app-config
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: yatri-db-secret
                  key: POSTGRES_PASSWORD
---
apiVersion: v1
kind: Service
metadata:
  name: yatri-backend-service
  labels:
    app: yatri-app
spec:
  type: ClusterIP
  selector:
    app: yatri-backend
  ports:
    - port: 8080
      targetPort: 8080
